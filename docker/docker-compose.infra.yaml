services:
  db:
    container_name: ugr-db
    image: postgres:16.9
    restart: always
    volumes:
      - ../data/db:/var/lib/postgresql/data
    ports:
      - '${DB_PORT}:${DB_PORT}'
    environment:
      POSTGRES_PASSWORD: '${DB_PASSWORD}'
      POSTGRES_USER: '${DB_USER}'
      POSTGRES_DB: '${DB_NAME}'

  adminer:
    container_name: ugr-db-adminer
    image: adminer
    restart: always
    ports:
      - '${DB_ADMIN_PANEL_PORT}:${DB_ADMIN_PANEL_PORT}'
