# docker compose for backend team
include:
  - docker-compose.infra.yaml

services:
  frontend:
    container_name: frontend
    image: node:23.5.0-alpine
    ports:
      - '${FRONTEND_PORT:-3000}:3000'
    volumes:
      - ../frontend:/app
      - /app/node_modules
    environment:
      WATCHPACK_POLLING: 'true'
      VITE_HOST_IP: '${HOST_IP:-localhost}'
      VITE_API_TARGET: 'https://${HOST_IP:-localhost}:${BACKEND_PORT:-5223}'
      VITE_BACKEND_PORT: '${BACKEND_PORT:-5223}'
    # Use Vite dev server (exposes on 0.0.0.0). We run `npm ci` to install locked deps
    # and then start the vite dev server. The project exposes port 3000 in vite.config.ts.
    command: sh -c "cd /app && npm ci && npm run dev -- --host 0.0.0.0"
